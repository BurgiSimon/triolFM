<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How triolFM runs · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · triolFM</p>
    <h1>How triolFM runs</h1>

    <svg viewBox="0 0 1160 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="triolfm-flow-title triolfm-flow-desc">
      <title id="triolfm-flow-title">How triolFM runs</title>
      <desc id="triolfm-flow-desc">Swimlane diagram of the triolFM Dynamic Island: the widget starts a poller thread that reads Spotify playback state and hands it to the Qt main thread through a queue, while pointer input opens the island and control presses run on short-lived worker threads that call the Web API and wake the poller for fast re-checks.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="80"  x2="1120" y2="80"  stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="168" x2="1120" y2="168" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="256" x2="1120" y2="256" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="344" x2="1120" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="432" x2="1120" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="520" x2="1120" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Actor column divider -->
      <line x1="160" y1="80" x2="160" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="52" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">USER</text>
      <text x="52" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MAIN · QT</text>
      <text x="52" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">POLLER</text>
      <text x="52" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKERS</text>
      <text x="52" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SPOTIFY</text>

      <!-- ============ Arrows (drawn before boxes) ============ -->

      <!-- a. Island() -> poller thread -->
      <line x1="250" y1="236" x2="250" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- b. poller -> Web API -->
      <line x1="250" y1="324" x2="250" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- c. Web API -> drain()  (coral: the queue handoff) -->
      <path d="M 500,452 V 220 Q 500,212 508,212 H 548" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- d. drain() -> art worker -->
      <line x1="618" y1="236" x2="618" y2="352" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- e. art worker -> drain() -->
      <line x1="660" y1="352" x2="660" y2="236" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- f. drain() -> frame() -->
      <line x1="688" y1="212" x2="732" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- g. pointer -> frame() -->
      <line x1="802" y1="148" x2="802" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- h. pointer -> press() -->
      <path d="M 872,124 H 960 Q 968,124 968,132 V 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- i. press() -> _do() worker -->
      <line x1="986" y1="236" x2="986" y2="352" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- j. _do() worker -> Web API -->
      <line x1="1010" y1="400" x2="1010" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- k. _do() worker -> poller  (coral: wake.set() + urgent fast polls; hops the queue riser) -->
      <path d="M 940,400 V 412 Q 940,420 932,420 H 508 a 8,8 0 0,0 -16,0 H 302 Q 294,420 294,412 V 324"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- ============ Arrow labels ============ -->

      <rect x="258" y="250" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="262" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">START THREAD</text>

      <rect x="178" y="380" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="238" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">GET PLAYER</text>

      <rect x="508" y="294" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="303" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">QUEUE.PUT</text>

      <rect x="546" y="326" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="606" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ART THREAD</text>

      <rect x="668" y="290" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="672" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">QUEUE ART</text>

      <rect x="690" y="192" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

      <rect x="810" y="162" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="814" y="171" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HOVER</text>

      <rect x="877" y="104" width="78" height="12" rx="2" fill="#f5f5f5"/>
      <text x="916" y="113" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLICK / SCROLL</text>

      <rect x="994" y="288" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="998" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">THREAD</text>

      <rect x="1018" y="418" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1022" y="427" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PUT / POST</text>

      <rect x="787" y="400" width="86" height="12" rx="2" fill="#f5f5f5"/>
      <text x="830" y="409" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAKE · URGENT</text>

      <!-- ============ Nodes ============ -->

      <!-- USER: pointer -->
      <rect x="732" y="100" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="732" y="100" width="140" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="802" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pointer</text>
      <text x="802" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hover · click · scroll</text>

      <!-- MAIN: Island() -->
      <rect x="180" y="188" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="188" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Island()</text>
      <text x="250" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dock · tray · timers</text>

      <!-- MAIN: drain() -->
      <rect x="548" y="188" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="548" y="188" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="618" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">drain()</text>
      <text x="618" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">100 ms · apply()</text>

      <!-- MAIN: frame() -->
      <rect x="732" y="188" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="732" y="188" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="802" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">frame()</text>
      <text x="802" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">morph · spring · paint</text>

      <!-- MAIN: press() -->
      <rect x="916" y="188" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="916" y="188" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="986" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">press()</text>
      <text x="986" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">optimistic state</text>

      <!-- POLLER: poller loop -->
      <rect x="180" y="276" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="276" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">poller loop</text>
      <text x="250" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">backoff · wake.wait()</text>

      <!-- WORKERS: art worker -->
      <rect x="548" y="352" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="548" y="352" width="140" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="618" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">art worker</text>
      <text x="618" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fetch_art · dominant()</text>

      <!-- WORKERS: _do() worker -->
      <rect x="916" y="352" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="916" y="352" width="140" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="986" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">_do() worker</text>
      <text x="986" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">play · next · seek · vol</text>

      <!-- SPOTIFY: Web API band -->
      <rect x="180" y="452" width="876" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="452" width="876" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="192" y="458" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="214" y="467" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OAUTH</text>
      <text x="618" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spotify Web API</text>
      <text x="618" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PKCE + refresh token · /me/player · /me/player/{play,pause,next,previous,seek,volume}</text>

      <!-- ============ Legend ============ -->
      <line x1="40" y1="548" x2="1120" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="584" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="592" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Main-thread step</text>

      <rect x="190" y="584" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="210" y="592" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">User input</text>

      <rect x="340" y="584" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="360" y="592" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Spawned thread</text>

      <rect x="490" y="584" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="510" y="592" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">External API</text>

      <line x1="660" y1="590" x2="688" y2="590" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="696" y="592" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Call / step</text>

      <line x1="830" y1="590" x2="858" y2="590" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="866" y="592" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Async / return</text>

      <line x1="990" y1="590" x2="1018" y2="590" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="1026" y="592" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Queue / wake loop</text>
    </svg>
  </div>
</body>
</html>
