name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the .deb declares in Depends, so it has to build there
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pillow is real here, so test_dominant runs its colour maths instead of
      # skipping itself against the stub
      - run: pip install pillow
      # best effort: where a PySide6 wheel exists the Island tests run too,
      # where it doesn't they skip themselves
      - run: pip install PySide6 || true
      - run: python test_triolfm.py
      - run: python triolfm.py --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build-deb.sh
      - run: dpkg-deb --info triolfm_*_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: triolfm_*_all.deb

  release:
    # a v* tag publishes the .deb on the Releases page the README points at
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # the tag has to match __version__, or the release ships a differently named .deb
      - run: test "v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' spotify_backend.py)" = "$GITHUB_REF_NAME"
      - run: ./build-deb.sh
      - run: gh release create "$GITHUB_REF_NAME" triolfm_*_all.deb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
